<svg
  width="240"
  height="260"
  viewBox="0 0 240 260"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Avada Kedavra Green Magic Glow Filter -->
    <filter id="chibiMagicGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="spellOrbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#70ff85" />
      <stop offset="65%" stop-color="#00e640" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00b32c" stop-opacity="0" />
    </radialGradient>

    <!-- Head skin gradient -->
    <linearGradient id="headSkin" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#eff4db" />
      <stop offset="60%" stop-color="#e3eabf" />
      <stop offset="100%" stop-color="#ccd5a3" />
    </linearGradient>

    <!-- Robe gradient -->
    <linearGradient id="robeShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2c30" />
      <stop offset="40%" stop-color="#181a1c" />
      <stop offset="100%" stop-color="#0c0d0e" />
    </linearGradient>

    <!-- Nagini Skin gradient -->
    <linearGradient id="snakeSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#556e29" />
      <stop offset="50%" stop-color="#3c5218" />
      <stop offset="100%" stop-color="#24330b" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="120" cy="245" rx="75" ry="8" fill="#141812" opacity="0.18" />

  <!-- Nagini Lower Body (Trailing behind feet) -->
  <path
    d="M 125 180 C 100 185, 75 195, 75 220 C 75 240, 95 248, 105 248 C 115 248, 85 240, 85 220 C 85 200, 110 195, 130 190 Z"
    fill="url(#snakeSkin)"
    stroke="#222b0f"
    stroke-width="3"
    stroke-linejoin="round"
  />
  {/* Nagini Spots */}
  <path d="M 85 210 Q 90 220 82 230" stroke="#1f2c09" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Chibi Robe (Black Kimono/Wizard Robe) -->
  <path
    d="M 70 148 C 70 148, 90 145, 120 145 C 150 145, 175 152, 190 190 L 195 240 L 90 242 L 68 185 Z"
    fill="url(#robeShade)"
    stroke="#26292c"
    stroke-width="3.5"
    stroke-linejoin="round"
  />
  {/* Robe Fold Details */}
  <path d="M 120 145 L 142 240" stroke="#101113" stroke-width="3" />
  <path d="M 120 145 L 98 220" stroke="#36393e" stroke-width="2.5" />
  <path d="M 115 145 L 130 180 L 105 200" stroke="#36393e" stroke-width="2.5" fill="none" />

  <!-- Feet / Toes -->
  <g fill="#d8e2b2" stroke="#3d453d" stroke-width="1.8">
    <ellipse cx="115" cy="242" rx="4" ry="2.5" />
    <ellipse cx="121" cy="242" rx="3.5" ry="2.2" />
    <ellipse cx="127" cy="242" rx="3" ry="2" />
  </g>

  <!-- Left Arm / Wide Sleeve holding Wand -->
  <path
    d="M 70 148 L 100 190 L 70 195 L 60 148 Z"
    fill="url(#robeShade)"
    stroke="#26292c"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Hand & Magic Wand -->
  <g>
    <!-- Little Skeleton Hand -->
    <circle cx="58" cy="154" r="5" fill="#e3eabf" stroke="#3d453d" stroke-width="2" />
    
    <!-- Wooden Wand -->
    <path d="M 60 156 L 22 130" stroke="#704b28" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 60 156 L 22 130" stroke="#4a3017" stroke-width="2" stroke-linecap="round" />

    <!-- Wand Tip Spell Glow Effect -->
    <circle cx="18" cy="127" r="22" fill="url(#spellOrbGrad)" filter="url(#chibiMagicGlow)" />
    <circle cx="18" cy="127" r="12" fill="#80ff95" filter="url(#chibiMagicGlow)" />
    <circle cx="18" cy="127" r="5" fill="#ffffff" />
  </g>

  <!-- Nagini Upper Body & Head (Resting on shoulder) -->
  <g>
    <!-- Snake Neck & Head -->
    <path
      d="M 160 135 C 160 115, 175 115, 195 120 C 215 125, 220 150, 205 170 C 190 185, 170 180, 160 155 Z"
      fill="url(#snakeSkin)"
      stroke="#222b0f"
      stroke-width="3.5"
      stroke-linejoin="round"
    />

    <!-- Snake Eye (Glowing Yellow/Orange) -->
    <circle cx="190" cy="140" r="10" fill="#ffd000" stroke="#222b0f" stroke-width="2" />
    <ellipse cx="190" cy="140" r="2.5" ry="7" fill="#cc0000" />
    <circle cx="187" cy="136" r="2.5" fill="#ffffff" />

    <!-- Red Bifurcated Tongue -->
    <path d="M 172 152 Q 165 156 160 152 M 160 152 L 155 148 M 160 152 L 155 156" stroke="#ff3333" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Snake Head Details / Nostril -->
    <circle cx="178" cy="144" r="1.5" fill="#1c240b" />
    <path d="M 175 148 Q 185 150 195 147" stroke="#1c240b" stroke-width="2" fill="none" />
  </g>

  <!-- Big Chibi Bald Head -->
  <ellipse cx="130" cy="85" rx="72" ry="70" fill="url(#headSkin)" stroke="#3d453d" stroke-width="4" />

  <!-- Green Magical Reflection along Head Jaw Curve -->
  <path d="M 64 85 C 64 125, 90 148, 125 148" stroke="#00e640" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#chibiMagicGlow)" opacity="0.85" />

  <!-- Right Ear -->
  <path d="M 198 88 C 205 85, 206 98, 198 104 Z" fill="#e3eabf" stroke="#3d453d" stroke-width="3" stroke-linejoin="round" />
  <path d="M 198 92 Q 201 96 198 99" stroke="#3d453d" stroke-width="2" fill="none" />

  <!-- Disgruntled Facial Features -->
  <!-- Eyebrows (Angry/Angled) -->
  <path d="M 85 66 L 100 78" stroke="#3d453d" stroke-width="4" stroke-linecap="round" />
  <path d="M 155 66 L 140 78" stroke="#3d453d" stroke-width="4" stroke-linecap="round" />

  <!-- Squinting Angry Eyes (Closed Arcs) -->
  <path d="M 78 86 Q 92 98 104 88" stroke="#3d453d" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 160 86 Q 146 98 134 88" stroke="#3d453d" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Cute Slit Nose -->
  <path d="M 116 100 L 112 106 M 122 100 L 126 106" stroke="#3d453d" stroke-width="3" stroke-linecap="round" />

  <!-- Downturned Frown Mouth -->
  <path d="M 108 120 Q 120 114 132 121" stroke="#3d453d" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Cheek Cheekbone Line -->
  <path d="M 156 120 Q 170 105 166 90" stroke="#bcc599" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>
